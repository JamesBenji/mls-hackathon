[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not live"
markers =
    live: hits the real Gemma cloud API / telephony (skipped by default; run with -m live)
filterwarnings =
    ignore::DeprecationWarning:apscheduler.*
    ignore:Using `httpx` with `starlette.testclient`
