# Optional override; the source must already be a FILE on the Coolify Docker host.
services:
  api:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_HOST_PATH:?Set an absolute host path to the Firebase ADC JSON file}
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
